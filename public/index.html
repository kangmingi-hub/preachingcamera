<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ══════════════════════════════
// [패치] SUPABASE + 로그인 연동
// ══════════════════════════════
const SUPA_URL = 'https://ouugfofqiefrbfshgeep.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91dWdmb2ZxaWVmcmJmc2hnZWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzgyODUsImV4cCI6MjA5NDc1NDI4NX0.5wlvTtlLPPQ8C5JF8dwzB1Rgo2rGf1oniF9wasZLi6g';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── 1. 로그인 체크 (비로그인이면 login.html로) ──
let arUser = null;
try { arUser = JSON.parse(localStorage.getItem('ar_user') || 'null'); } catch(e) {}
if (!arUser?.id) { location.replace('login.html'); }

// ── 2. 홈 상단에 유저 정보 + 버튼 삽입 ──
(function injectUI() {
  const home = document.getElementById('home');
  if (!home) return;

  // 유저 바
  const bar = document.createElement('div');
  bar.style.cssText = `
    position:absolute; top:14px; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px;
  `;
  bar.innerHTML = `
    <div style="font-size:13px;color:rgba(255,255,255,.6);
      background:rgba(255,255,255,.08);border-radius:99px;padding:5px 13px;">
      👤 <span style="color:#FFD700;font-weight:700;">${arUser.nickname}</span>
    </div>
    <button onclick="doLogout()" style="
      font-size:11px;color:rgba(255,255,255,.35);
      background:transparent;border:1px solid rgba(255,255,255,.15);
      border-radius:99px;padding:5px 11px;cursor:pointer;
      font-family:'Noto Sans KR',sans-serif;
    ">로그아웃</button>
  `;
  home.appendChild(bar);

  // 내 도감 버튼
  const colBtn = document.createElement('button');
  colBtn.textContent = '📖 내 도감';
  colBtn.onclick = () => location.href = 'collection.html';
  colBtn.style.cssText = `
    position:absolute; bottom:56px; right:20px; z-index:1;
    background:rgba(255,215,0,.12); border:1px solid rgba(255,215,0,.3);
    color:#FFD700; font-size:12px; border-radius:99px;
    padding:7px 14px; cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  `;
  home.appendChild(colBtn);
})();

// ── 3. 로그아웃 ──
function doLogout() {
  localStorage.removeItem('ar_user');
  location.replace('login.html');
}

// captureAndShow를 직접 덮어쓰지 않고,
// takePhoto에서 호출 후 저장하는 방식으로 변경
const _origTakePhoto = takePhoto;
takePhoto = async function() {
  await _origTakePhoto();
  const char = state.currentChar;
  if (char && arUser?.id) saveToCollection(char);
};

async function saveToCollection(char) {
  try {
    const { data: existing } = await sb
      .from('collections')
      .select('id, count')
      .eq('user_id', arUser.id)
      .eq('character_id', char.id)
      .maybeSingle();

    if (existing) {
      await sb.from('collections').update({
        count: existing.count + 1,
        last_obtained_at: new Date().toISOString()
      }).eq('id', existing.id);
      showToast(`📖 ${char.name} +1 (${existing.count + 1}번째 획득!)`);
    } else {
      await sb.from('collections').insert({
        user_id: arUser.id,
        character_id: char.id,
        character_name: char.name,
        grade: char.grade,
        emoji: char.emoji || null,
        count: 1,
        first_obtained_at: new Date().toISOString(),
        last_obtained_at: new Date().toISOString()
      });
      showToast(`✨ 새 캐릭터 도감 등록! [${char.name}]`);
    }

    // 가챠 로그
    await sb.from('gacha_logs').insert({
      user_id: arUser.id,
      character_id: char.id,
      character_name: char.name,
      grade: char.grade
    });

  } catch(e) {
    console.error('도감 저장 실패', e);
  }
}
</script>
