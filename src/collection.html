<title>내 도감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--gold:#FFD700;--gold2:#FFA500;--common-c:#88aacc;--rare-c:#aa88ff;--epic-c:#ff9900;--legend-c:#FFD700}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:linear-gradient(160deg,#0d1b3e,#0a0a2e);font-family:'Noto Sans KR',sans-serif;color:white}

/* 헤더 */
.header{position:sticky;top:0;z-index:50;background:rgba(10,10,46,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,215,0,.15);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-family:'Black Han Sans',sans-serif;font-size:20px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:white;border-radius:99px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}

/* 유저 정보 */
.user-bar{padding:14px 18px 0;display:flex;align-items:center;gap:10px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:rgba(255,215,0,.15);border:2px solid rgba(255,215,0,.4);display:flex;align-items:center;justify-content:center;font-size:18px}
.user-info .name{font-family:'Black Han Sans',sans-serif;font-size:16px;color:var(--gold)}
.user-info .stats{font-size:12px;color:rgba(255,255,255,.45);margin-top:2px}

/* 진행도 바 */
.progress-section{padding:14px 18px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px}
.progress-label span{color:var(--gold);font-weight:700}
.progress-bar{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .6s ease}

/* 등급 필터 */
.filter-row{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.fbtn{flex-shrink:0;padding:6px 14px;border-radius:99px;font-size:12px;cursor:pointer;border:1px solid;transition:all .2s;font-family:'Noto Sans KR',sans-serif;background:transparent}
.fbtn.all{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.2)}
.fbtn.all.on{background:rgba(255,255,255,.15);color:white;border-color:white}
.fbtn.common{color:var(--common-c);border-color:var(--common-c)}
.fbtn.common.on{background:rgba(136,170,204,.2)}
.fbtn.rare{color:var(--rare-c);border-color:var(--rare-c)}
.fbtn.rare.on{background:rgba(170,136,255,.2)}
.fbtn.epic{color:var(--epic-c);border-color:var(--epic-c)}
.fbtn.epic.on{background:rgba(255,153,0,.2)}
.fbtn.legend{color:var(--legend-c);border-color:var(--legend-c)}
.fbtn.legend.on{background:rgba(255,215,0,.2)}

/* 도감 그리드 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px 30px}

/* 카드 */
.card{border-radius:16px;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.95)}

/* 미획득 */
.card.locked{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.card.locked .silhouette{font-size:52px;filter:grayscale(1) brightness(.3);opacity:.5}
.card.locked .card-name{font-size:10px;color:rgba(255,255,255,.2);margin-top:6px;text-align:center;padding:0 4px}
.card.locked .card-grade-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;opacity:.3}

/* 획득 */
.card.unlocked{border:1px solid}
.card.unlocked.common{background:linear-gradient(160deg,#1a2a3e,#2a3a5e);border-color:var(--common-c)}
.card.unlocked.rare{background:linear-gradient(160deg,#1a0e3e,#2e1a6e);border-color:var(--rare-c)}
.card.unlocked.epic{background:linear-gradient(160deg,#2e1a00,#5e3a00);border-color:var(--epic-c)}
.card.unlocked.legend{background:linear-gradient(160deg,#2e2000,#5e4400);border-color:var(--legend-c);box-shadow:0 0 20px rgba(255,215,0,.3)}
.card.unlocked .char-img{width:70%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,215,0,.4))}
.card.unlocked .char-emoji{font-size:48px;filter:drop-shadow(0 0 8px rgba(255,215,0,.4))}
.card.unlocked .card-name{font-size:10px;color:white;font-weight:700;margin-top:4px;text-align:center;padding:0 4px}
.card.unlocked .card-count{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);border-radius:99px;padding:2px 6px;font-size:9px;color:var(--gold)}
.card.unlocked .card-grade-badge{position:absolute;top:6px;left:6px;font-size:8px;padding:2px 5px;border-radius:99px;border:1px solid}
.card.unlocked.common .card-grade-badge{color:var(--common-c);border-color:var(--common-c);background:rgba(136,170,204,.15)}
.card.unlocked.rare .card-grade-badge{color:var(--rare-c);border-color:var(--rare-c);background:rgba(170,136,255,.15)}
.card.unlocked.epic .card-grade-badge{color:var(--epic-c);border-color:var(--epic-c);background:rgba(255,153,0,.15)}
.card.unlocked.legend .card-grade-badge{color:var(--gold);border-color:var(--gold);background:rgba(255,215,0,.15)}

/* new 뱃지 */
.card .new-badge{position:absolute;top:6px;right:6px;background:var(--gold);color:#1a0800;font-size:8px;font-weight:700;padding:2px 5px;border-radius:99px}

/* 로딩 */
.loading{text-align:center;padding:60px 20px;color:rgba(255,255,255,.4);font-size:14px}
.spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,215,0,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:rgba(255,255,255,.3);font-size:14px;line-height:2}

/* 상세 모달 */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center}
.detail-overlay.open{display:flex}
.detail-box{background:linear-gradient(160deg,#1a1a4e,#0d1b3e);border-radius:24px;padding:28px 24px;width:min(300px,85vw);text-align:center;position:relative}
.detail-box .grade-badge{font-size:11px;padding:3px 12px;border-radius:99px;border:1px solid;margin-bottom:12px;display:inline-block}
.detail-box.common .grade-badge{color:var(--common-c);border-color:var(--common-c);background:rgba(136,170,204,.15)}
.detail-box.rare .grade-badge{color:var(--rare-c);border-color:var(--rare-c);background:rgba(170,136,255,.15)}
.detail-box.epic .grade-badge{color:var(--epic-c);border-color:var(--epic-c);background:rgba(255,153,0,.15)}
.detail-box.legend .grade-badge{color:var(--gold);border-color:var(--gold);background:rgba(255,215,0,.15)}
.detail-img{font-size:80px;margin:10px 0}
.detail-name{font-family:'Black Han Sans',sans-serif;font-size:22px;color:var(--gold);margin-bottom:4px}
.detail-desc{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:14px;line-height:1.6}
.detail-stats{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.detail-stat{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 14px;font-size:11px;color:rgba(255,255,255,.5)}
.detail-stat span{display:block;font-size:18px;color:var(--gold);font-family:'Black Han Sans',sans-serif;margin-bottom:2px}
.detail-close{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:white;border-radius:99px;padding:12px;font-size:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
</style>
</head>

let allChars=[];
let myCollection=[];
let currentFilter='all';

async function init(){
  document.getElementById('user-name').textContent=arUser.nickname;
  allChars = getAllChars(); // async 제거
  const{data}=await sb.from('collections').select('*')
    .or(`user_id.eq.${arUser.id},nickname.eq.${arUser.nickname}`);
  myCollection=data||[];
  renderStats();
  renderGrid();
}

function renderStats(){
const total=allChars.length;
const obtained=myCollection.length;
const pct=total>0?Math.round(obtained/total*100):0;
document.getElementById('user-stats').textContent='획득 '+obtained+' / 전체 '+total;
document.getElementById('progress-pct').textContent=pct+'%';
document.getElementById('progress-fill').style.width=pct+'%';
}

function setFilter(f){
currentFilter=f;
document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
document.querySelector('.fbtn.'+f).classList.add('on');
renderGrid();
}

function renderGrid(){
const grid=document.getElementById('grid');
let chars=allChars;
if(currentFilter!=='all') chars=chars.filter(c=>c.grade===currentFilter);

if(chars.length===0){
grid.innerHTML='<div class="empty" style="grid-column:1/-1">캐릭터가 없어요.<br>캐릭터 관리에서 추가해보세요!</div>';
return;
}

grid.innerHTML=chars.map(char=>{
const col=myCollection.find(c=>c.character_id===char.id);
if(col){
  const img='<img src="'+GITHUB_IMG+char.id+'.png" class="char-img" alt="'+char.name+'" onerror="this.style.display=\'none\'">';
 return '<div class="card unlocked '+char.grade+'" onclick="openDetail('+JSON.stringify(char.id)+')">'
  +'<div class="card-grade-badge">'+char.grade.toUpperCase()+'</div>'
  +'<div class="card-count">×'+col.count+'</div>'
  +img
  +'<div class="card-name">'+char.name+'</div>'
  +'</div>';
} else {
  const gradeColors={common:'#88aacc',rare:'#aa88ff',epic:'#ff9900',legend:'#FFD700'};
  return '<div class="card locked">'
  +'<div class="silhouette">🫥</div>'
  +'<div class="card-name">???</div>'
  +'<div class="card-grade-dot" style="background:'+gradeColors[char.grade]+'"></div>'
  +'</div>';
}
 
  return '<div class="card locked">'
+'<div class="silhouette">🫥</div>'
+'<div class="card-name">???</div>'
+'<div class="card-grade-dot" style="background:'+gradeColors[char.grade]+'"></div>'
+'</div>';
}
}).join('');
}

function openDetail(charId){
const char=allChars.find(c=>c.id===charId);
const col=myCollection.find(c=>c.character_id===charId);
if(!char||!col) return;

const box=document.getElementById('detail-box');
box.className='detail-box '+char.grade;
document.getElementById('detail-grade').textContent=GRADE_LABELS[char.grade];
document.getElementById('detail-img').innerHTML='<img src="'+GITHUB_IMG+char.id+'.png" style="width:80px;height:80px;object-fit:contain;" onerror="this.style.display=\'none\'">';
  document.getElementById('detail-name').textContent=char.name; document.getElementById('detail-desc').textContent=char.desc||''; document.getElementById('detail-count').textContent=col.count; 
  const d=new Date(col.first_obtained_at); 
  document.getElementById('detail-date').textContent=(d.getMonth()+1)+'/'+d.getDate();
document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(){
document.getElementById('detail-overlay').classList.remove('open');
}

init();
</script>
