<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>관리자 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--gold:#FFD700;--gold2:#FFA500;--red:#ff6b6b;--red2:#ff4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:linear-gradient(160deg,#0d1b3e,#0a0a2e);font-family:'Noto Sans KR',sans-serif;color:white}

/* 헤더 */
.header{position:sticky;top:0;z-index:50;background:rgba(10,10,46,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,215,0,.15);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-family:'Black Han Sans',sans-serif;font-size:20px;background:linear-gradient(135deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:white;border-radius:99px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}

/* 섹션 */
.section{padding:20px 18px}
.section-title{font-family:'Black Han Sans',sans-serif;font-size:15px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title span{font-family:'Noto Sans KR',sans-serif;font-size:11px;color:rgba(255,255,255,.35);font-weight:400}

/* 추가 폼 */
.add-form{background:rgba(255,255,255,.04);border:1px solid rgba(255,215,0,.15);border-radius:18px;padding:18px}
.add-form input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px 16px;color:white;font-size:16px;outline:none;font-family:'Noto Sans KR',sans-serif;transition:border-color .2s;margin-bottom:10px}
.add-form input:focus{border-color:var(--gold)}
.add-form input::placeholder{color:rgba(255,255,255,.25)}
.btn-add{width:100%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a0800;font-family:'Black Han Sans',sans-serif;font-size:16px;border:none;border-radius:99px;padding:13px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn-add:active{transform:scale(.97)}
.btn-add:disabled{opacity:.5;cursor:not-allowed}
.init-pw-note{font-size:11px;color:rgba(255,255,255,.3);text-align:center;margin-top:8px}

/* 유저 목록 */
.user-list{display:flex;flex-direction:column;gap:8px}
.user-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;transition:border-color .2s}
.user-item:hover{border-color:rgba(255,215,0,.2)}
.user-left{display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.user-name{font-weight:700;font-size:14px;color:white}
.user-meta{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.badge-admin{display:inline-block;font-size:9px;color:var(--gold);background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.user-actions{display:flex;gap:6px}
.btn-reset{background:rgba(255,165,0,.1);border:1px solid rgba(255,165,0,.3);color:#FFA500;border-radius:99px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.btn-reset:active{transform:scale(.95)}
.btn-del{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.3);color:var(--red);border-radius:99px;padding:5px 11px;font-size:11px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
.btn-del:active{transform:scale(.95)}

/* 통계 */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;text-align:center}
.stat-num{font-family:'Black Han Sans',sans-serif;font-size:24px;color:var(--gold)}
.stat-label{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px}

/* 로딩 */
.loading{text-align:center;padding:40px;color:rgba(255,255,255,.3);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,215,0,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 빈 상태 */
.empty{text-align:center;padding:30px;color:rgba(255,255,255,.25);font-size:13px}

/* 토스트 */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(30,30,60,.95);border:1px solid rgba(255,215,0,.3);color:white;padding:10px 20px;border-radius:99px;font-size:13px;z-index:999;white-space:nowrap;animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:linear-gradient(160deg,#1a1a4e,#0d1b3e);border:1px solid rgba(255,215,0,.2);border-radius:20px;padding:24px;width:min(300px,85vw);text-align:center}
.modal-title{font-family:'Black Han Sans',sans-serif;font-size:18px;color:var(--gold);margin-bottom:8px}
.modal-msg{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:20px;line-height:1.6}
.modal-btns{display:flex;gap:8px}
.modal-ok{flex:1;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a0800;font-family:'Black Han Sans',sans-serif;font-size:15px;border:none;border-radius:99px;padding:12px;cursor:pointer}
.modal-cancel{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:white;font-family:'Noto Sans KR',sans-serif;font-size:14px;border-radius:99px;padding:12px;cursor:pointer}

/* 접근 거부 */
.access-denied{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px}
.access-denied .icon{font-size:64px;margin-bottom:16px}
.access-denied h2{font-family:'Black Han Sans',sans-serif;font-size:22px;color:var(--red);margin-bottom:8px}
.access-denied p{font-size:13px;color:rgba(255,255,255,.4);line-height:1.6}
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ 관리자</h1>
  <button class="btn-back" onclick="location.href='/'">← 홈</button>
</div>

<div id="main-content">
  <div class="loading"><div class="spinner"></div><br>확인 중...</div>
</div>

<!-- 확인 모달 -->
<div class="modal-bg" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-msg" id="modal-msg"></div>
    <div class="modal-btns">
      <button class="modal-cancel" id="modal-cancel">취소</button>
      <button class="modal-ok" id="modal-ok">확인</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL='https://ouugfofqiefrbfshgeep.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91dWdmb2ZxaWVmcmJmc2hnZWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzgyODUsImV4cCI6MjA5NDc1NDI4NX0.5wlvTtlLPPQ8C5JF8dwzB1Rgo2rGf1oniF9wasZLi6g';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let arUser = null;
try { arUser = JSON.parse(localStorage.getItem('ar_user') || 'null'); } catch(e) {}
if (!arUser?.id) location.replace('/login');

function showToast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function showConfirm(title, msg, onOk) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal-ok').onclick = () => { document.getElementById('modal').classList.remove('open'); onOk(); };
  document.getElementById('modal-cancel').onclick = () => document.getElementById('modal').classList.remove('open');
}

async function init() {
  // role 확인
  const { data: me } = await sb.from('users').select('role').eq('id', arUser.id).single();
  if (!me || me.role !== 'admin') {
    document.getElementById('main-content').innerHTML = `
      <div class="access-denied">
        <div class="icon">🚫</div>
        <h2>접근 권한 없음</h2>
        <p>관리자 계정으로만<br>접근할 수 있습니다.</p>
      </div>`;
    return;
  }
  renderAdminPage();
  await loadUsers();
}

function renderAdminPage() {
  document.getElementById('main-content').innerHTML = `
    <!-- 통계 -->
    <div class="section">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num" id="stat-total">-</div><div class="stat-label">전체 참여자</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-user">-</div><div class="stat-label">일반 유저</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-admin">-</div><div class="stat-label">관리자</div></div>
      </div>

      <!-- 참여자 추가 -->
      <div class="section-title">👤 참여자 추가</div>
      <div class="add-form">
        <input type="text" id="new-nickname" placeholder="닉네임 입력" maxlength="20"
          onkeydown="if(event.key==='Enter') addUser()">
        <button class="btn-add" id="btn-add" onclick="addUser()">+ 참여자 추가</button>
        <div class="init-pw-note">🔑 초기 비밀번호: 1234</div>
      </div>
    </div>

    <!-- 참여자 목록 -->
    <div class="section" style="padding-top:0">
      <div class="section-title">📋 참여자 목록 <span id="user-count-label"></span></div>
      <div class="user-list" id="user-list">
        <div class="loading"><div class="spinner"></div><br>불러오는 중...</div>
      </div>
    </div>
  `;
}

async function loadUsers() {
  const { data: users, error } = await sb.from('users').select('id,nickname,role').order('role').order('nickname');
  if (error || !users) { showToast('❌ 불러오기 실패'); return; }

  // 통계
  const total = users.length;
  const admins = users.filter(u => u.role === 'admin').length;
  const regular = total - admins;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-user').textContent = regular;
  document.getElementById('stat-admin').textContent = admins;
  document.getElementById('user-count-label').textContent = `총 ${total}명`;

  // 목록
  const list = document.getElementById('user-list');
  if (!users.length) { list.innerHTML = '<div class="empty">참여자가 없습니다</div>'; return; }

  list.innerHTML = users.map(u => `
    <div class="user-item">
      <div class="user-left">
        <div class="user-avatar">${u.role === 'admin' ? '👑' : '👤'}</div>
        <div>
          <div class="user-name">
            ${u.nickname}
            ${u.role === 'admin' ? '<span class="badge-admin">관리자</span>' : ''}
          </div>
          <div class="user-meta">${u.role === 'admin' ? '관리자 계정' : '일반 참여자'}</div>
        </div>
      </div>
      ${u.role !== 'admin' ? `
      <div class="user-actions">
        <button class="btn-reset" onclick="resetPassword('${u.id}','${u.nickname}')">🔑 초기화</button>
        <button class="btn-del" onclick="deleteUser('${u.id}','${u.nickname}')">삭제</button>
      </div>` : ''}
    </div>
  `).join('');
}

async function addUser() {
  const input = document.getElementById('new-nickname');
  const nickname = input.value.trim();
  if (!nickname) { showToast('닉네임을 입력하세요'); return; }

  const btn = document.getElementById('btn-add');
  btn.disabled = true; btn.textContent = '추가 중...';

  const { data: exist } = await sb.from('users').select('id').eq('nickname', nickname).maybeSingle();
  if (exist) { showToast('❌ 이미 존재하는 닉네임이에요'); btn.disabled=false; btn.textContent='+ 참여자 추가'; return; }

  const { error } = await sb.from('users').insert({ nickname, password: '1234', role: 'user' });
  if (error) { showToast('❌ 추가 실패: ' + error.message); btn.disabled=false; btn.textContent='+ 참여자 추가'; return; }

  input.value = '';
  btn.disabled = false; btn.textContent = '+ 참여자 추가';
  showToast('✅ ' + nickname + ' 추가됨! (초기 비번: 1234)');
  await loadUsers();
}

async function resetPassword(id, nickname) {
  showConfirm('비밀번호 초기화', `${nickname}의 비밀번호를\n1234로 초기화할까요?`, async () => {
    const { error } = await sb.from('users').update({ password: '1234' }).eq('id', id);
    if (error) { showToast('❌ 초기화 실패'); return; }
    showToast('🔑 ' + nickname + ' 비밀번호 → 1234');
  });
}

async function deleteUser(id, nickname) {
  showConfirm('참여자 삭제', `${nickname}을 삭제할까요?\n도감 데이터도 함께 삭제됩니다.`, async () => {
    await sb.from('collections').delete().eq('user_id', id);
    await sb.from('gacha_logs').delete().eq('user_id', id);
    const { error } = await sb.from('users').delete().eq('id', id);
    if (error) { showToast('❌ 삭제 실패'); return; }
    showToast('🗑️ ' + nickname + ' 삭제됨');
    await loadUsers();
  });
}

init();
</script>

<!-- 비밀번호 변경 버튼은 메인 앱(app.js)의 injectHomeUserBar에 추가 필요 -->
<!-- 아래는 참여자 본인이 비밀번호 변경하는 기능 (메인 앱에 추가) -->
</body>
</html>
